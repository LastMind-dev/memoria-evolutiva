name: Documentação

# Impede que a documentação canônica volte a mentir.
#
# Os validadores vêm do pacote `memoria-evolutiva` (Python), instalado via pip — sem
# dependências além da biblioteca padrão. As verificações têm severidades
# DELIBERADAMENTE diferentes; os passos abaixo formam uma única catraca:
#
#   memoria validar     FALHA DURA para documento que tem frontmatter. Âncora quebrada,
#                       vocabulário inválido, id duplicado, cadeia rompida ou derivado
#                       editado à mão quebram o build no commit que causou.
#
#   memoria catraca     CATRACA. Mede a dívida existente e falha só se aumentar.
#                       Quando a regra nasce depois do código, reprovar tudo trava o
#                       time sem consertar nada — e build que nasce vermelho ninguém olha.
#
#   memoria bancos status --offline  Compara documentos/código e artefatos locais com
#                                     os marcadores. O runner não hospeda Hindsight.
#
#   memoria autoteste   Quebra uma cópia do projeto de propósito e confere que cada
#                       validador reclama do que promete. Verificador que não reprova
#                       nada é indistinguível de verificador quebrado.
#
# A instalação baixa a versão imutável do pacote. As verificações não sobem framework
# nem tocam banco do produto.
#
# Se os extratores próprios do projeto (`gerado.extensao_do_projeto`) forem escritos
# em outra linguagem, instale o interpretador dela aqui — ex.: PHP via
# shivammathur/setup-php@v2 antes do passo de validar.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  documentacao:
    name: Integridade da documentação
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar os validadores
        # O instalador troca o marcador por SHA Git exato ou versão exata do release.
        run: pip install <MEMORIA_EVOLUTIVA_ORIGEM_IMUTAVEL>

      - name: Estrutura, âncoras, cadeia e derivados
        run: memoria validar

      - name: Catraca da dívida
        run: memoria catraca

      - name: Hindsight e Graphify em dia
        run: memoria bancos status --offline

      - name: Skill portátil em dia, quando gerada
        run: memoria skill --conferir

      - name: Manifesto determinístico do RAG em dia
        run: memoria fragmentos verificar

      - name: Catraca de qualidade e drift do RAG
        run: memoria avaliar verificar

      - name: Os validadores ainda pegam o que prometem
        run: memoria autoteste

      - name: O que fazer quando falha
        if: failure()
        run: |
          echo "::notice::Derivado divergente → rode 'memoria gerar' e commite a saída."
          echo "::notice::Catraca → código novo introduziu violação. Ver docs/politicas/."
          echo "::notice::Bancos → rode 'memoria bancos sincronizar' e versione os artefatos."
          echo "::notice::Skill → rode 'memoria skill' e versione novamente a peça derivada."
          echo "::notice::RAG → rode 'memoria fragmentos gerar' e versione o manifesto."
          echo "::notice::Avaliação RAG → corrija a recuperação e rode 'memoria avaliar gerar'; só use 'medir' para uma nova linha de base deliberada."
          echo "::notice::Âncora quebrada → o documento cita arquivo que não existe. O código ganha."
          echo "::notice::Cadeia → deriva_de aponta para documento inexistente, invertido ou superado."
