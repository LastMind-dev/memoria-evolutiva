name: Testes do pacote

# O pacote que valida os outros precisa se validar. Este workflow instala o padrão num
# projeto sintético e confere que a bateria inteira fica verde — inclusive o autoteste,
# que quebra o projeto de propósito e confere que cada validador reclama.
#
# O motor testado é o Python (o mantido). O legado-php/ é arquivo morto: fica no
# repositório para quem já depende dele via Composer, mas não entra no CI — testar o
# que não se mantém é prometer o que não se cumpre.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regressoes:
    name: Regressões · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Testes unitários e de regressão
        run: python -m unittest discover -s tests -v

  fluxo-completo:
    name: Instalação e verificações num projeto sintético
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar o pacote
        run: pip install $GITHUB_WORKSPACE

      - name: Montar projeto sintético
        run: |
          mkdir -p /tmp/fixture/src/Servicos
          printf '<?php\nclass S { function f(){ sleep(1); return env("K"); } }\n' > /tmp/fixture/src/Servicos/S.php
          printf '<?php\nclass R {}\n' > /tmp/fixture/src/Raiz.php
          cd /tmp/fixture && git init -b main && git add -A
          git -c user.email=ci@ci -c user.name=ci commit -m fixture

      - name: Instalar o padrão
        run: cd /tmp/fixture && memoria instalar --projeto="fixture" --codigo=src --sem-bancos

      - name: Gerar derivados e congelar a dívida
        run: |
          cd /tmp/fixture
          memoria gerar
          memoria catraca --medir

      - name: Bateria completa
        run: |
          cd /tmp/fixture
          memoria skill
          memoria skill --conferir
          memoria validar
          memoria catraca
          memoria bancos status
          memoria autoteste

      - name: Protocolo neutro de extratores (o exemplo do repositório funciona)
        run: |
          cd /tmp/fixture
          mkdir -p scripts
          cp $GITHUB_WORKSPACE/exemplos/extratores-projeto.py scripts/
          python3 scripts/extratores-projeto.py | python3 -c "import json,sys; d=json.load(sys.stdin); assert all(k in d[0] for k in ('nome','id','titulo','corpo')), d"

      - name: A árvore continua limpa depois de validar
        run: |
          cd /tmp/fixture && git add -A
          test -z "$(git diff --cached --name-only -- . ':!docs' ':!padrao.json' ':!.github' ':!AGENTS.md' ':!CLAUDE.md' ':!.cursor' ':!.windsurfrules' ':!scripts' ':!skill-memoria-evolutiva')"
